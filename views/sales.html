<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - TechStore Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading p-4">
                <i class="bi bi-cpu-fill fs-3"></i><br>TECHSTORE
            </div>
            <div class="list-group list-group-flush">
                <a href="dashboard.html" class="list-group-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="products.html" class="list-group-item"><i class="bi bi-laptop"></i> Products</a>
                <a href="refurbished.html" class="list-group-item"><i class="bi bi-recycle"></i> Refurbished</a>
                <a href="accessories.html" class="list-group-item"><i class="bi bi-headset"></i> Accessories</a>
                <a href="sales.html" class="list-group-item active"><i class="bi bi-receipt"></i> Sales</a>
                <a href="purchases.html" class="list-group-item"><i class="bi bi-cart"></i> Purchases</a>
                <a href="customers.html" class="list-group-item"><i class="bi bi-people"></i> Customers</a>
                <a href="suppliers.html" class="list-group-item"><i class="bi bi-truck"></i> Suppliers</a>
                <a href="ledger.html" class="list-group-item"><i class="bi bi-book"></i> Ledger</a>
                <a href="reports.html" class="list-group-item"><i class="bi bi-bar-chart"></i> Reports</a>
                <a href="users.html" class="list-group-item"><i class="bi bi-person-gear"></i> Users</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
                <button class="btn btn-glass me-3" id="menu-toggle"><i class="bi bi-list"></i></button>
                <h4 class="m-0 fw-bold">SALES & INVOICING</h4>
            </nav>

            <div class="container-fluid p-4">
                <div class="row g-4">
                    <div class="col-md-8">
                        <div class="glass-card mb-4">
                            <h5 class="fw-bold mb-4">New Invoice</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Customer</label>
                                    <select class="form-select bg-dark border-secondary text-white">
                                        <option>Select Customer</option>
                                        <option>John Doe</option>
                                        <option>Walk-in Customer</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Date</label>
                                    <input type="date" class="form-control bg-dark border-secondary text-white">
                                </div>
                            </div>
                            
                            <hr class="my-4 border-secondary">
                            
                            <div class="table-responsive">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th style="width: 40%">Item</th>
                                            <th>Price</th>
                                            <th style="width: 15%">Qty</th>
                                            <th>Total</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody id="invoice-items">
                                        <tr>
                                            <td>
                                                <select class="form-select bg-dark border-secondary text-white">
                                                    <option>Gaming Mouse</option>
                                                    <option>Core i7 Laptop</option>
                                                </select>
                                            </td>
                                            <td>$2,500</td>
                                            <td><input type="number" class="form-control bg-dark border-secondary text-white" value="1"></td>
                                            <td>$2,500</td>
                                            <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <button class="btn btn-outline-info btn-sm mt-2"><i class="bi bi-plus-lg"></i> Add Item</button>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="glass-card">
                            <h5 class="fw-bold mb-4">Summary</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <span class="fw-bold">$2,500.00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Discount</span>
                                <input type="number" class="form-control form-control-sm w-25 bg-dark border-secondary text-white text-end" value="0">
                            </div>
                            <hr class="border-secondary">
                            <div class="d-flex justify-content-between mb-4">
                                <span class="fs-5">Grand Total</span>
                                <span class="fs-5 fw-bold text-accent">$2,500.00</span>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-glass">Generate Invoice</button>
                                <button class="btn btn-outline-secondary">Save Draft</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("menu-toggle").addEventListener("click", () => {
            document.getElementById("wrapper").classList.toggle("toggled");
        });
    </script>
</body>
</html>
