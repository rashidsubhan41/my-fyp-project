<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - TechStore Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading p-4">
                <i class="bi bi-cpu-fill fs-3"></i><br>TECHSTORE
            </div>
            <div class="list-group list-group-flush">
                <a href="dashboard.html" class="list-group-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="products.html" class="list-group-item"><i class="bi bi-laptop"></i> Products</a>
                <a href="refurbished.html" class="list-group-item"><i class="bi bi-recycle"></i> Refurbished</a>
                <a href="accessories.html" class="list-group-item"><i class="bi bi-headset"></i> Accessories</a>
                <a href="sales.html" class="list-group-item"><i class="bi bi-receipt"></i> Sales</a>
                <a href="purchases.html" class="list-group-item"><i class="bi bi-cart"></i> Purchases</a>
                <a href="customers.html" class="list-group-item"><i class="bi bi-people"></i> Customers</a>
                <a href="suppliers.html" class="list-group-item"><i class="bi bi-truck"></i> Suppliers</a>
                <a href="ledger.html" class="list-group-item"><i class="bi bi-book"></i> Ledger</a>
                <a href="reports.html" class="list-group-item"><i class="bi bi-bar-chart"></i> Reports</a>
                <a href="users.html" class="list-group-item active"><i class="bi bi-person-gear"></i> Users</a>
                <a href="../login.html" class="list-group-item mt-5 text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
                <button class="btn btn-glass me-3" id="menu-toggle"><i class="bi bi-list"></i></button>
                <h4 class="m-0 fw-bold">USER MANAGEMENT</h4>
                <button class="btn btn-glass ms-auto"><i class="bi bi-person-plus me-2"></i> Add New User</button>
            </nav>

            <div class="container-fluid p-4">
                <div class="glass-card animate-fade-in">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Full Name</th>
                                    <th>Username</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="user-list">
                                <!-- Data from API -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("menu-toggle").addEventListener("click", () => {
            document.getElementById("wrapper").classList.toggle("toggled");
        });

        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const list = document.getElementById('user-list');
            list.innerHTML = users.map(u => `
                <tr>
                    <td><div class="fw-bold">${u.name}</div></td>
                    <td>${u.username}</td>
                    <td><span class="badge bg-primary-subtle text-primary border border-primary px-3">${u.role}</span></td>
                    <td><span class="badge bg-success-subtle text-success border border-success px-3">${u.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        loadUsers();
    </script>
</body>
</html>
