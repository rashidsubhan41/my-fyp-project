<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - TechStore Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <div class="sidebar-heading p-4">
                <i class="bi bi-cpu-fill fs-3"></i><br>TECHSTORE
            </div>
            <div class="list-group list-group-flush">
                <a href="dashboard.html" class="list-group-item"><i class="bi bi-grid-1x2"></i> Dashboard</a>
                <a href="products.html" class="list-group-item active"><i class="bi bi-laptop"></i> Products</a>
                <a href="refurbished.html" class="list-group-item"><i class="bi bi-recycle"></i> Refurbished</a>
                <a href="accessories.html" class="list-group-item"><i class="bi bi-headset"></i> Accessories</a>
                <a href="sales.html" class="list-group-item"><i class="bi bi-receipt"></i> Sales</a>
                <a href="purchases.html" class="list-group-item"><i class="bi bi-cart"></i> Purchases</a>
                <a href="customers.html" class="list-group-item"><i class="bi bi-people"></i> Customers</a>
                <a href="suppliers.html" class="list-group-item"><i class="bi bi-truck"></i> Suppliers</a>
                <a href="ledger.html" class="list-group-item"><i class="bi bi-book"></i> Ledger</a>
                <a href="reports.html" class="list-group-item"><i class="bi bi-bar-chart"></i> Reports</a>
                <a href="users.html" class="list-group-item"><i class="bi bi-person-gear"></i> Users</a>
                <a href="../login.html" class="list-group-item mt-5 text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
                <button class="btn btn-glass me-3" id="menu-toggle"><i class="bi bi-list"></i></button>
                <h4 class="m-0 fw-bold">PRODUCT MANAGEMENT</h4>
                <button class="btn btn-glass ms-auto" data-bs-toggle="modal" data-bs-target="#addProductModal">
                    <i class="bi bi-plus-lg me-2"></i> Add Product
                </button>
            </nav>

            <div class="container-fluid p-4">
                <div class="glass-card animate-fade-in">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="m-0 fw-bold">Inventory List</h5>
                        <div class="input-group w-25">
                            <span class="input-group-text bg-dark border-secondary text-white"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control bg-dark border-secondary text-white" placeholder="Search products...">
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Brand</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="product-list">
                                <!-- Data from API -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card" style="background: rgba(15, 23, 42, 0.95);">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="addProductForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control bg-dark border-secondary text-white" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Brand</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select bg-dark border-secondary text-white">
                                    <option>New Computers</option>
                                    <option>Accessories</option>
                                    <option>Hardware</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price</label>
                                <input type="number" class="form-control bg-dark border-secondary text-white" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Initial Stock</label>
                                <input type="number" class="form-control bg-dark border-secondary text-white" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-glass">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById("menu-toggle").addEventListener("click", () => {
            document.getElementById("wrapper").classList.toggle("toggled");
        });

        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.brand}</td>
                    <td><span class="badge bg-info-subtle text-info px-2">${p.category}</span></td>
                    <td>$${p.price.toLocaleString()}</td>
                    <td>
                        <span class="fw-bold ${p.stock < 5 ? 'text-danger' : 'text-success'}">${p.stock}</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        loadProducts();
    </script>
</body>
</html>
