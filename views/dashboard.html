<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TechStore</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar Navigation -->
        <nav class="bg-dark text-white p-3" style="min-width:220px;">
            <h4 class="mb-4 fw-bold" style="color: var(--accent-color); letter-spacing: 1px;">TechStore</h4>
            <ul class="nav flex-column">
              <li class="nav-item"><a href="dashboard.html" class="nav-link text-white"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
              <li class="nav-item"><a href="products.html" class="nav-link text-white"><i class="bi bi-box"></i> Products</a></li>
              <li class="nav-item"><a href="sales.html" class="nav-link text-white"><i class="bi bi-cash"></i> Sales</a></li>
              <li class="nav-item"><a href="purchases.html" class="nav-link text-white"><i class="bi bi-cart"></i> Purchases</a></li>
              <li class="nav-item"><a href="customers.html" class="nav-link text-white"><i class="bi bi-people"></i> Customers</a></li>
              <li class="nav-item"><a href="suppliers.html" class="nav-link text-white"><i class="bi bi-truck"></i> Suppliers</a></li>
              <li class="nav-item"><a href="ledger.html" class="nav-link text-white"><i class="bi bi-journal"></i> Ledger</a></li>
              <li class="nav-item"><a href="reports.html" class="nav-link text-white"><i class="bi bi-bar-chart"></i> Reports</a></li>
              <li class="nav-item"><a href="users.html" class="nav-link text-white"><i class="bi bi-person"></i> Users</a></li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-primary" id="menu-toggle"><i class="bi bi-list"></i> Toggle Menu</button>
                    <div class="ms-auto">
                        <span class="me-3">Welcome, Admin</span>
                        <a href="login.html" class="btn btn-sm btn-outline-danger">Logout</a>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <h1 class="mt-4 fw-bold" style="color: var(--accent-color);">Admin Dashboard</h1>
                <p class="mb-4">Overview of Computer Store Inventory & Sales</p>
                <div class="row g-4" id="dashboard-stats">
                  <!-- Dashboard stats will be loaded here by JS -->
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Fetch dashboard stats from Node.js API
    fetch('/api/dashboard-stats')
      .then(res => res.json())
      .then(data => {
        const stats = [
          { title: 'Total Sales Today', value: `$${data.totalSales}` , icon: 'bi-cash-coin', color: 'glass-card', accent: 'stat-card-primary'},
          { title: 'Products In Stock', value: data.productsInStock, icon: 'bi-box-seam', color: 'glass-card', accent: 'stat-card-success'},
          { title: 'Low Stock Alerts', value: data.lowStockAlerts, icon: 'bi-exclamation-triangle', color: 'glass-card', accent: 'stat-card-warning'},
          { title: 'Active Customers', value: data.activeCustomers, icon: 'bi-people', color: 'glass-card', accent: 'stat-card-info'}
        ];
        document.getElementById('dashboard-stats').innerHTML = stats.map(s => `
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="${s.color} ${s.accent} mb-3 animate-fade-in" style="min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;">
              <div class="d-flex align-items-center mb-2">
                <i class="bi ${s.icon} fs-2 me-3" style="color: var(--accent-color);"></i>
                <h5 class="card-title mb-0">${s.title}</h5>
              </div>
              <h2 class="fw-bold" style="color: var(--accent-color);">${s.value}</h2>
            </div>
          </div>
        `).join('');
      });
    </script>
    <style>
    @media (max-width: 991.98px) {
      #wrapper { flex-direction: column !important; }
      nav[style*="min-width:220px"] { min-width: 100% !important; width: 100% !important; border-radius: 0 !important; }
      #page-content-wrapper { width: 100% !important; }
    }
    @media (max-width: 575.98px) {
      .glass-card { padding: 12px !important; }
      .card-title, h2 { font-size: 1rem !important; }
    }
    </style>
</body>
</html>
