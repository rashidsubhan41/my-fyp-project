<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechStore Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="./assets/css/style.css" rel="stylesheet">
    <style>
        .login-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box glass-card animate-fade-in">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color: var(--accent-color);">TechStore</h2>
                <p class="text-white-50">Management System Login</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" id="username" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password" placeholder="Enter password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <div class="mt-4 text-center">
                <p class="small text-white-50">Authorized Personnel Only</p>
            </div>
        </div>
    </div>

            <script>
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                // Simulate login success
                window.location.href = './views/dashboard.html';
            });
            </script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // For demo purposes, we'll allow any login
            // In real app, we would call /api/login
            window.location.href = './views/dashboard.html';
        });
    </script>
</body>
</html>
